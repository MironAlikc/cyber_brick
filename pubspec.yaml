name: cyber_brick
description: "A new Flutter project."
publish_to: 'none'

version: 2.0.0+3

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^2.0.0
  flutter_bloc: ^9.1.1
  equatable: ^3.0.0
  hive_flutter: ^1.1.0
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
  fonts:
    - family: PressStart2P
      fonts:
        - asset: assets/fonts/PressStart2P-Regular.ttf
    - family: LcdFont
      fonts:
        - asset: assets/fonts/LcdFont.ttf